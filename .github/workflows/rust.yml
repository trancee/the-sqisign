name: Rust

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "src/**"
      - "include/**"
      - "KAT/**"
      - ".github/workflows/rust.yml"
      # Documentation does not affect the build.
      - "!rust/**/*.md"
  pull_request:
    paths:
      - "rust/**"
      - "src/**"
      - "include/**"
      - "KAT/**"
      - ".github/workflows/rust.yml"
      # Documentation does not affect the build.
      - "!rust/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: rust

env:
  CARGO_TERM_COLOR: always

jobs:
  # Differential tests against the vendor C reference on each 64-bit host.
  test:
    name: Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
          - platform: macos-aarch64
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup toolchain install
      # Signing is slow without optimisation; the coverage job runs the unoptimised build.
      - name: Test
        run: cargo test --locked --release

  # Format, lint and the 100 % coverage gate (lines, functions, regions, branches; ADR 0004). Branch coverage needs
  # nightly, so coverage runs on the pinned nightly of the Miri job.
  quality:
    name: Format, lint, coverage
    runs-on: ubuntu-24.04
    env:
      COVERAGE_TOOLCHAIN: nightly-2026-10-23
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchains
        run: |
          rustup toolchain install
          rustup toolchain install "$COVERAGE_TOOLCHAIN" --profile minimal --component llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Coverage
        run: scripts/coverage.sh

  # No conditional branch in constant-time code of the shipped build (ADR 0004 item 16).
  ct-branches:
    name: Constant-time branches (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
          - platform: macos-aarch64
            os: macos-15
          # Android ABIs; a static library needs no NDK linker. `arm64-v8a` has the generic AArch64 tuning, unlike
          # macOS (`rust/.cargo/config.toml`).
          - platform: android-arm64-v8a
            os: ubuntu-24.04
            target: aarch64-linux-android
          - platform: android-armeabi-v7a
            os: ubuntu-24.04
            target: armv7-linux-androideabi
          - platform: android-x86
            os: ubuntu-24.04
            target: i686-linux-android
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Add target
        if: matrix.target
        run: rustup target add ${{ matrix.target }}
      - name: Check
        run: python3 scripts/ct_branches.py ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

  # Undefined behaviour in the C ABI, the only `unsafe` shipped, interpreted by Miri on a pinned nightly. The tests
  # that run the protocol take an hour or more each interpreted and are ignored under Miri (`tests/miri.rs`).
  miri:
    name: Miri (C ABI)
    runs-on: ubuntu-24.04
    env:
      MIRI_TOOLCHAIN: nightly-2026-10-23
      # The tests read a KAT entry from `../KAT`.
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v5
      - name: Install Miri
        run: rustup toolchain install "$MIRI_TOOLCHAIN" --profile minimal --component miri,rust-src
      - name: Set up Miri
        run: cargo "+$MIRI_TOOLCHAIN" miri setup
      - name: Test
        run: cargo "+$MIRI_TOOLCHAIN" miri test --locked -p sqisign-capi --test miri
