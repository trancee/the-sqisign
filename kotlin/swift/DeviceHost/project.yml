# Host app for running the Swift tests and benchmarks on a physical iOS device, where SwiftPM package tests need an
# app host. Generate with `xcodegen generate` from this directory; the generated project is not committed.
name: SqiSignDeviceHost
options:
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    # App IDs are unique across teams; another team overrides it, e.g. `xcodebuild ... BUNDLE_ID_PREFIX=com.example`.
    BUNDLE_ID_PREFIX: org.sqisign
targets:
  SqiSignTestHost:
    type: application
    platform: iOS
    sources: [HostApp.swift]
    info:
      path: build/HostInfo.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).SqiSignTestHost
  SqiSignKit:
    type: library.static
    platform: iOS
    sources: [../Sources/SqiSignKit]
    dependencies:
      - framework: ../../build/XCFrameworks/release/SqiSign.xcframework
        embed: false
    settings:
      base:
        PRODUCT_MODULE_NAME: SqiSignKit
        SWIFT_STRICT_CONCURRENCY: complete
  SqiSignDeviceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [../Tests/SqiSignKitTests]
    dependencies:
      - target: SqiSignTestHost
      - target: SqiSignKit
      - framework: ../../build/XCFrameworks/release/SqiSign.xcframework
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).SqiSignDeviceTests
  SqiSignDeviceBenchmarks:
    type: bundle.unit-test
    platform: iOS
    sources: [../Tests/SqiSignKitBenchmarks]
    dependencies:
      - target: SqiSignTestHost
      - target: SqiSignKit
      - framework: ../../build/XCFrameworks/release/SqiSign.xcframework
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).SqiSignDeviceBenchmarks
schemes:
  SqiSignDeviceTests:
    build:
      targets:
        SqiSignTestHost: all
        SqiSignDeviceTests: [test]
    test:
      targets: [SqiSignDeviceTests]
  # Release build of the Swift layer; the SqiSign XCFramework is always the optimized release build.
  SqiSignDeviceBenchmarks:
    build:
      targets:
        SqiSignTestHost: all
        SqiSignDeviceBenchmarks: [test]
    test:
      config: Release
      targets: [SqiSignDeviceBenchmarks]
