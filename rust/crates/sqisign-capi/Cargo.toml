[package]
name = "sqisign-capi"
version = "0.1.0"
description = "The sqisign_kmp C ABI of the Kotlin bindings over the Rust port"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["staticlib", "rlib"]
# No unit tests in src: a second instrumented copy of the #[no_mangle]
# entry points makes llvm-cov report them uncovered on x86_64 Linux.
test = false
doctest = false

[dependencies]
sqisign = { path = "../sqisign" }

[dev-dependencies]
sqisign-reference = { path = "../sqisign-reference" }

[lints]
workspace = true
